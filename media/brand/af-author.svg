<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="作者主页">
  <!--
    ★ v2.42 自有图标：作者 / 创作者（用于取代原第三方平台入口）
    ==================================================================
    语义说明：那个入口指向的是**作者本人的作品主页**。
    换成中性的"作者"图标（人像 + 作品标记）后：
      · 不再出现任何第三方平台符号；
      · 链接指向站内文档站的致谢/作者页，不再跳外链。
    画法：肩线以上的头部轮廓 + 左侧的"作品"方块标记。
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 头部 -->
    <circle cx="12" cy="8.2" r="3.6"/>
    <!-- 肩线：一条开口弧，而不是实心块（实心会显得像"用户"菜单的剪影图标） -->
    <path d="M4.8 19.4a7.4 7.4 0 0 1 14.4 0"/>
    <!-- 左侧"作品"标记：一本翻开的册子（本站是文档/教程站，这个语义比"视频"贴切） -->
    <path d="M3 6.2h4.2a1.4 1.4 0 0 1 1.4 1.4v6.8a1.2 1.2 0 0 0-1.2-1.2H3z"
          stroke-width="1.35" fill="currentColor" fill-opacity=".16"/>
  </g>
</svg>
