<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Mod 仓库">
  <!--
    ★ v2.42 自有图标：分享 / 分发（用于取代原第三方平台入口）
    ==================================================================
    为什么是「分享」而不是别的图形：
      那个入口做的事是"把内容分享给别人"，而**分发本身**与用哪个平台无关。
      换成中性的分发图标后：
        · 视觉上不再出现任何第三方品牌符号；
        · 语义反而更准确 —— 之前挂着一个具体平台的图标，
          读者会误以为"只能通过这个平台联系/获取"。
    画法：两个节点之间的双向箭头 + 连接弧，纯几何路径。
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 上下两个节点（抽象成短横线，不画成具体平台的形状） -->
    <path d="M7 4.6h10"/>
    <path d="M7 19.4h10"/>
    <!-- 中间的连接弧 -->
    <path d="M7 4.6v4.2a2 2 0 0 0 2 2h8"/>
    <path d="M17 19.4v-4.2a2 2 0 0 0-2-2H7" stroke-opacity=".55"/>
    <!-- 双向箭头：表示"来回"都能走 -->
    <path d="M14.4 8.4l2.6 2.4-2.6 2.4"/>
    <path d="M9.6 10.8 7 13.2l2.6 2.4" stroke-opacity=".55"/>
  </g>
  <circle cx="7" cy="4.6" r="2" fill="currentColor"/>
  <circle cx="17" cy="19.4" r="2" fill="currentColor"/>
</svg>
