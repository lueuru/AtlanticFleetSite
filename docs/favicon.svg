<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="大西洋舰队 Mod 框架">
  <!--
    站点主图标：雷达罗盘 + 舰影
    ★ 为什么重画：原版用的是荧光青（#2ee6c8 / #58f0d8）+ 蓝色刻度，
      与全站的黄铜配色（#e0b15c）完全打架 —— 这是「配色冲突」和
      「左上角图标没改」两件事的同一个根因。改成黄铜单色系。
    ★ 尺寸：导航条里的 logo 渲染成 24×24（暗色底），
      所以所有描边都 >= 2（在 64 网格里，缩到 24px 仍有 0.75px，不糊）。
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16303f"/>
      <stop offset="100%" stop-color="#08131c"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d79a"/>
      <stop offset="52%" stop-color="#e0b15c"/>
      <stop offset="100%" stop-color="#a87c1c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <rect x="1.4" y="1.4" width="61.2" height="61.2" rx="10.6"
        fill="none" stroke="url(#brass)" stroke-opacity=".42" stroke-width="1.6"/>

  <!-- 罗盘环 -->
  <g fill="none" stroke="url(#brass)" stroke-width="2.2">
    <circle cx="32" cy="32" r="19.5" stroke-opacity=".85"/>
    <circle cx="32" cy="32" r="12.5" stroke-opacity=".38" stroke-width="1.5"/>
  </g>

  <!-- 扫描扇形（黄铜半透明，不刺眼） -->
  <path d="M32 32 L32 12.5 A19.5 19.5 0 0 1 48.1 22 Z"
        fill="url(#brass)" fill-opacity=".20"/>

  <!-- 指针 -->
  <line x1="32" y1="32" x2="32" y2="12.5" stroke="url(#brass)" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="url(#brass)"/>

  <!-- 四方位刻度：只留上下左右，短而实 -->
  <g stroke="url(#brass)" stroke-width="2" stroke-opacity=".72" stroke-linecap="round">
    <line x1="32" y1="4.6" x2="32" y2="9.4"/>
    <line x1="32" y1="54.6" x2="32" y2="59.4"/>
    <line x1="4.6" y1="32" x2="9.4" y2="32"/>
    <line x1="54.6" y1="32" x2="59.4" y2="32"/>
  </g>

  <!-- 舰影：右下方一艘侧影小船，点出「大西洋舰队」主题 -->
  <g fill="url(#brass)" fill-opacity=".92">
    <path d="M40 40.5h12.5l-2 4.2H42.2z"/>
    <path d="M43.4 36.4h6.2l1.5 3.6H41.9z"/>
    <rect x="45.4" y="31.6" width="2.1" height="4.6" rx=".7"/>
  </g>
  <!-- 尾迹 -->
  <path d="M37.2 44.6c1.6 0 2.6.7 2.6 1.6s-1 1.6-2.6 1.6"
        fill="none" stroke="url(#brass)" stroke-width="1.7" stroke-opacity=".55" stroke-linecap="round"/>
</svg>