<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="大西洋舰队 Mod 框架">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061420"/>
      <stop offset="55%" stop-color="#081c2c"/>
      <stop offset="100%" stop-color="#03080f"/>
    </linearGradient>
    <radialGradient id="halo" cx="76%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#2ee6c8" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#2ee6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8f5e5"/>
      <stop offset="100%" stop-color="#2ee6c8"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8f5e5"/>
      <stop offset="100%" stop-color="#2ee6c8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- 海图网格 -->
  <g stroke="#2ee6c8" stroke-opacity=".09" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- 右侧雷达 -->
  <g transform="translate(880 300)">
    <circle r="205" fill="#061420" stroke="#2ee6c8" stroke-opacity=".4" stroke-width="1.5"/>
    <circle r="196" fill="none" stroke="#2ee6c8" stroke-opacity=".14" stroke-width="1"/>
    <g fill="none" stroke="#2ee6c8" stroke-opacity=".2" stroke-width="1">
      <circle r="66"/><circle r="132"/><circle r="186"/>
    </g>
    <g stroke="#2ee6c8" stroke-opacity=".1" stroke-width="1">
      <line x1="-205" y1="0" x2="205" y2="0"/><line x1="0" y1="-205" x2="0" y2="205"/>
    </g>
    <path d="M0 0 L0 -196 A196 196 0 0 1 139 -139 Z" fill="#58f0d8" fill-opacity=".14"/>
    <line x1="0" y1="0" x2="139" y2="-139" stroke="#58f0d8" stroke-width="2" stroke-opacity=".8"/>
    <circle r="3.4" fill="#58f0d8"/>
  </g>

  <!-- 左侧文案 -->
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="88" y="238" font-size="76" font-weight="600" fill="url(#ttl)" letter-spacing="1">大西洋舰队</text>
    <text x="88" y="326" font-size="76" font-weight="300" fill="#d8eaf2" letter-spacing="1">Mod 框架</text>
    <line x1="90" y1="372" x2="250" y2="372" stroke="#2ee6c8" stroke-width="2.4"/>
    <text x="88" y="424" font-size="27" fill="#7d9bb0" letter-spacing=".5">参数调节 · 自定义舰船 · 自制模型 · 在线仓库</text>
    <text x="88" y="468" font-size="27" fill="#7d9bb0" letter-spacing=".5">不用写一行代码</text>
    <text x="88" y="556" font-size="21" fill="#4d6b80" font-family="Consolas,monospace" letter-spacing="3">BY URUBAN</text>
  </g>

  <!-- 左下舰船剪影 -->
  <g transform="translate(88 520) scale(.62)" opacity=".9">
    <path d="M0 46 L13 14 L20 32 L84 32 L92 8 L100 32 L164 32 L171 14 L184 46 Z" fill="url(#ship)"/>
    <rect x="76" y="0" width="30" height="16" rx="2" fill="#c9fbf0"/>
    <rect x="88" y="-14" width="4.5" height="16" fill="#c9fbf0"/>
  </g>

  <!-- 角标准星 -->
  <g stroke="#2ee6c8" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 82h26M40 82v26"/>
    <path d="M1160 548h-26M1160 548v-26"/>
  </g>
</svg>
